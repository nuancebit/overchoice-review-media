name: Guide and Pages

# Daily: regenerate the 7-day guide, commit it when it changed, deploy the site to GitHub Pages.
# The daily commit keeps the repository active, so GitHub does not disable the schedule
# after 60 days without activity.
on:
  schedule:
    - cron: "17 0 * * *"   # daily, 00:17 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Generate guide.xml and playlist.m3u
        run: |
          python3 scripts/gen_guide.py
          python3 scripts/gen_playlist.py
      - name: Check playlist and guide
        run: python3 scripts/check.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- guide.xml playlist.m3u; then
            echo "guide.xml and playlist.m3u unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide.xml playlist.m3u
          git commit -m "Refresh guide for $(date -u +%F)"
          git push origin HEAD:main
      - name: Stage site
        run: |
          mkdir -p _site
          cp -R playlist.m3u guide.xml catalog.json README.md LICENSE .nojekyll art _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true   # ships .nojekyll

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
